        width="42"
        height="42"/>

    <text
        x="580"
        y="317"
        fill="#e2e8f0"
        font-size="14"
        font-family="monospace">

        React

    </text>


    <!-- ================================================= -->
    <!-- DATABASE -->
    <!-- ================================================= -->

    <text
        x="70"
        y="375"
        fill="#38bdf8"
        font-size="15"
        font-family="monospace">

        DATABASE

    </text>


    <!-- MYSQL -->
    <image
        href="https://raw.githubusercontent.com/devicons/devicon/master/icons/mysql/mysql-original-wordmark.svg"
        x="70"
        y="390"
        width="42"
        height="42"/>

    <text
        x="120"
