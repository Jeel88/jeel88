<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="620"
    viewBox="0 0 1000 620">

    <defs>

        <!-- ================================= -->
        <!-- GLASS BACKGROUND -->
        <!-- ================================= -->

        <linearGradient
            id="glass"
            x1="0"
            y1="0"
            x2="1"
            y2="1">

            <stop
                offset="0%"
                stop-color="#111827"/>

            <stop
                offset="100%"
                stop-color="#020617"/>

        </linearGradient>


        <!-- ================================= -->
        <!-- SOFT BLUE GLOW -->
        <!-- ================================= -->

        <radialGradient id="glow">

            <stop
                offset="0%"
                stop-color="#38bdf8"
                stop-opacity="0.14"/>

            <stop
                offset="100%"
                stop-color="#38bdf8"
                stop-opacity="0"/>

        </radialGradient>


        <!-- ================================= -->
        <!-- WINDOW SHADOW -->
        <!-- ================================= -->

        <filter id="shadow">

            <feDropShadow
                dx="0"
                dy="15"
                stdDeviation="20"
                flood-opacity="0.35"/>

        </filter>


        <!-- ================================= -->
        <!-- PORTRAIT CLIPPING -->
        <!-- ================================= -->

        <clipPath id="portraitClip">

            <rect
                x="45"
                y="205"
                width="500"
                height="335"
                rx="16"/>

        </clipPath>

    </defs>


    <!-- ===================================== -->
    <!-- GLASS WINDOW -->
    <!-- ===================================== -->

    <rect
        x="20"
        y="20"
        width="960"
        height="580"
        rx="24"
        fill="url(#glass)"
        stroke="#334155"
        stroke-width="1"
        filter="url(#shadow)"/>


    <!-- ===================================== -->
    <!-- BACKGROUND GLOW -->
    <!-- ===================================== -->

    <ellipse
        cx="500"
        cy="300"
        rx="420"
        ry="260"
        fill="url(#glow)"/>


    <!-- ===================================== -->
    <!-- macOS TRAFFIC LIGHTS -->
    <!-- ===================================== -->

    <circle
        cx="55"
        cy="55"
        r="8"
        fill="#ff5f57"/>

    <circle
        cx="80"
        cy="55"
        r="8"
        fill="#febc2e"/>

    <circle
        cx="105"
        cy="55"
        r="8"
        fill="#28c840"/>


    <!-- ===================================== -->
    <!-- WINDOW TITLE -->
    <!-- ===================================== -->

    <text
        x="500"
        y="61"
        text-anchor="middle"
        fill="#94a3b8"
        font-size="16"
        font-family="monospace">

        jeel@github — zsh

    </text>


    <!-- ===================================== -->
    <!-- DIVIDER -->
    <!-- ===================================== -->

    <line
        x1="20"
        y1="90"
        x2="980"
        y2="90"
        stroke="#334155"/>


    <!-- ===================================== -->
    <!-- TERMINAL HEADER -->
    <!-- ===================================== -->

    <text
        x="50"
        y="130"
        fill="#64748b"
        font-size="15"
        font-family="monospace">

        Last login: today on github

    </text>


    <!-- COMMAND PROMPT -->

    <text
        x="50"
        y="170"
        fill="#e2e8f0"
        font-size="20"
        font-family="monospace">

        jeel@github %

    </text>


    <!-- COMMAND -->

    <text
        x="220"
        y="170"
        fill="#38bdf8"
        font-size="20"
        font-family="monospace">

        whoami

    </text>


    <!-- ===================================== -->
    <!-- PORTRAIT PANEL -->
    <!-- ===================================== -->

    <rect
        x="45"
        y="205"
        width="500"
        height="335"
        rx="16"
        fill="#020617"
        opacity="0.55"/>


    <!-- ===================================== -->
    <!-- PORTRAIT INNER BORDER -->
    <!-- ===================================== -->

    <rect
        x="45"
        y="205"
        width="500"
        height="335"
        rx="16"
        fill="none"
        stroke="#1e293b"
        stroke-width="1"/>


    <!-- ===================================== -->
    <!-- ASCII PORTRAIT -->
    <!-- ===================================== -->

    <!-- PORTRAIT_PLACEHOLDER -->


    <!-- ===================================== -->
    <!-- RIGHT INFORMATION -->
    <!-- ===================================== -->

    <text
        x="590"
        y="240"
        fill="#38bdf8"
        font-size="22"
        font-family="monospace">

        Jeel Savaliya

    </text>


    <!-- ROLE 1 -->

    <text
        x="590"
        y="280"
        fill="#e2e8f0"
        font-size="16"
        font-family="monospace">

        Python Developer

    </text>


    <!-- ROLE 2 -->

    <text
        x="590"
        y="312"
        fill="#e2e8f0"
        font-size="16"
        font-family="monospace">

        Flutter Developer

    </text>


    <!-- ROLE 3 -->

    <text
        x="590"
        y="344"
        fill="#e2e8f0"
        font-size="16"
        font-family="monospace">

        AI Builder

    </text>


    <!-- ===================================== -->
    <!-- INFORMATION DIVIDER -->
    <!-- ===================================== -->

    <line
        x1="590"
        y1="375"
        x2="930"
        y2="375"
        stroke="#334155"/>


    <!-- GITHUB -->

    <text
        x="590"
        y="410"
        fill="#64748b"
        font-size="14"
        font-family="monospace">

        github.com/Jeel88

    </text>


    <!-- DESCRIPTION -->

    <text
        x="590"
        y="440"
        fill="#64748b"
        font-size="14"
        font-family="monospace">

        Building things with Python

    </text>


    <text
        x="590"
        y="470"
        fill="#64748b"
        font-size="14"
        font-family="monospace">

        and Flutter.

    </text>


    <!-- ===================================== -->
    <!-- TERMINAL CURSOR -->
    <!-- ===================================== -->

    <rect
        x="50"
        y="570"
        width="10"
        height="18"
        fill="#38bdf8">

        <animate
            attributeName="opacity"
            values="1;0;1"
            dur="1s"
            repeatCount="indefinite"/>

    </rect>


</svg>