        fill="#e2e8f0"
        font-size="14"
        font-family="monospace">

        Python

    </text>


    <!-- ================================================= -->
    <!-- WEB -->
    <!-- ================================================= -->

    <text
        x="70"
        y="275"
        fill="#38bdf8"
        font-size="15"
        font-family="monospace">

