<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="620"
    viewBox="0 0 1000 620">

    <defs>

        <!-- GLASS -->

        <linearGradient
            id="glass"
            x1="0"
            y1="0"
            x2="1"
            y2="1">

            <stop
                offset="0%"
                stop-color="#111827"/>

            <stop
                offset="100%"
                stop-color="#020617"/>

        </linearGradient>


        <!-- BLUE GLOW -->

        <radialGradient id="glow">

            <stop
                offset="0%"
                stop-color="#38bdf8"
                stop-opacity="0.14"/>

            <stop
                offset="100%"
                stop-color="#38bdf8"
                stop-opacity="0"/>

        </radialGradient>


        <!-- SHADOW -->

        <filter id="shadow">

            <feDropShadow
                dx="0"
                dy="15"
                stdDeviation="20"
                flood-opacity="0.35"/>

        </filter>


        <!-- PORTRAIT CLIP -->

        <clipPath id="portraitClip">

            <rect
                x="45"
                y="205"
                width="360"
                height="300"
                rx="16"/>

        </clipPath>


        <!-- NAME CLIP -->

        <clipPath id="nameClip">

            <rect
                x="520"
                y="205"
                width="410"
                height="80"
                rx="8"/>

        </clipPath>

    </defs>


    <!-- ================================================= -->
    <!-- GLASS TERMINAL WINDOW -->
    <!-- ================================================= -->

    <rect
        x="20"
        y="20"
        width="960"
        height="580"
        rx="24"
        fill="url(#glass)"
        stroke="#334155"
        stroke-width="1"
        filter="url(#shadow)"/>


    <!-- ================================================= -->
    <!-- BACKGROUND GLOW -->
    <!-- ================================================= -->

    <ellipse
        cx="500"
        cy="300"
        rx="420"
        ry="260"
        fill="url(#glow)"/>


    <!-- ================================================= -->
    <!-- macOS TRAFFIC LIGHTS -->
    <!-- ================================================= -->

    <circle
        cx="55"
        cy="55"
        r="8"
        fill="#ff5f57"/>

    <circle
        cx="80"
        cy="55"
        r="8"
        fill="#febc2e"/>

    <circle
        cx="105"
        cy="55"
        r="8"
        fill="#28c840"/>


    <!-- ================================================= -->
    <!-- WINDOW TITLE -->
    <!-- ================================================= -->

    <text
        x="500"
        y="61"
        text-anchor="middle"
        fill="#94a3b8"
        font-size="16"
        font-family="monospace">

        jeel@github — zsh

    </text>


    <!-- ================================================= -->
    <!-- TOP DIVIDER -->
    <!-- ================================================= -->

    <line
        x1="20"
        y1="90"
        x2="980"
        y2="90"
        stroke="#334155"
        stroke-width="1"/>


    <!-- ================================================= -->
    <!-- LAST LOGIN -->
    <!-- ================================================= -->

    <text
        x="50"
        y="130"
        fill="#64748b"
        font-size="15"
        font-family="monospace">

        Last login: today on github

    </text>


    <!-- ================================================= -->
    <!-- TERMINAL COMMAND -->
    <!-- ================================================= -->

    <text
        x="50"
        y="170"
        fill="#e2e8f0"
        font-size="20"
        font-family="monospace">

        jeel@github %

    </text>


    <text
        x="220"
        y="170"
        fill="#38bdf8"
        font-size="20"
        font-family="monospace">

        whoami

    </text>


    <!-- ================================================= -->
    <!-- PORTRAIT BACKGROUND -->
    <!-- ================================================= -->

    <rect
        x="45"
        y="205"
        width="360"
        height="300"
        rx="16"
        fill="#020617"
        opacity="0.55"/>


    <!-- ================================================= -->
    <!-- ASCII PORTRAIT -->
    <!-- ================================================= -->

    <g
        clip-path="url(#portraitClip)">

        <!-- YOUR GENERATED ASCII SVG GOES HERE -->

        <!-- PORTRAIT_PLACEHOLDER -->

    </g>


    <!-- ================================================= -->
    <!-- PORTRAIT BORDER -->
    <!-- ================================================= -->

    <rect
        x="45"
        y="205"
        width="360"
        height="300"
        rx="16"
        fill="none"
        stroke="#1e293b"
        stroke-width="1"/>


    <!-- ================================================= -->
    <!-- JEEL ASCII -->
    <!-- ================================================= -->

    <g
        clip-path="url(#nameClip)">

        <!-- YOUR JEEL ASCII SVG GOES HERE -->

        <!-- NAME_PLACEHOLDER -->

    </g>


    <!-- ================================================= -->
    <!-- PYTHON DEVELOPER -->
    <!-- ================================================= -->

    <text
        x="520"
        y="310"
        fill="#e2e8f0"
        font-size="16"
        font-family="monospace">

        Python Developer

    </text>


    <!-- ================================================= -->
    <!-- Web DEVELOPER -->
    <!-- ================================================= -->

    <text
        x="520"
        y="342"
        fill="#e2e8f0"
        font-size="16"
        font-family="monospace">

        Web Developer

    </text>


    <!-- ================================================= -->
    <!-- AI Developer -->
    <!-- ================================================= -->

    <text
        x="520"
        y="374"
        fill="#e2e8f0"
        font-size="16"
        font-family="monospace">

        AI Developer

    </text>


    <!-- ================================================= -->
    <!-- INFORMATION DIVIDER -->
    <!-- ================================================= -->

    <line
        x1="520"
        y1="405"
        x2="930"
        y2="405"
        stroke="#334155"
        stroke-width="1"/>


    <!-- ================================================= -->
    <!-- GITHUB -->
    <!-- ================================================= -->

    <text
        x="520"
        y="440"
        fill="#64748b"
        font-size="14"
        font-family="monospace">

        github.com/Jeel88

    </text>


    <!-- ================================================= -->
    <!-- DESCRIPTION -->
    <!-- ================================================= -->

    <text
        x="520"
        y="470"
        fill="#64748b"
        font-size="14"
        font-family="monospace">

        Building things with Python

    </text>


    <text
        x="520"
        y="498"
        fill="#64748b"
        font-size="14"
        font-family="monospace">

        and Flutter.

    </text>


    <!-- ================================================= -->
    <!-- TERMINAL CURSOR -->
    <!-- ================================================= -->

    <rect
        x="50"
        y="570"
        width="10"
        height="18"
        rx="2"
        fill="#38bdf8">

        <animate
            attributeName="opacity"
            values="1;0;1"
            dur="1s"
            repeatCount="indefinite"/>

    </rect>

</svg>