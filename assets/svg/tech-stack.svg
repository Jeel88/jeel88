    </text>


    <!-- GIT -->
    <image
        href="https://raw.githubusercontent.com/devicons/devicon/master/icons/git/git-original.svg"
        x="70"
        y="490"
        width="42"
        height="42"/>

    <text
        x="120"
        y="517"
        fill="#e2e8f0"
        font-size="14"
        font-family="monospace">

        Git

    </text>


    <!-- GITHUB -->
    <image
        href="https://raw.githubusercontent.com/devicons/devicon/master/icons/github/github-original.svg"
        x="200"
        y="490"
        width="42"
        height="42"/>

    <text
        x="250"
        y="517"
        fill="#e2e8f0"
        font-size="14"
        font-family="monospace">

        GitHub

    </text>




    <!-- ================================================= -->
    <!-- CURSOR -->
    <!-- ================================================= -->

    <rect
        x="875"
        y="520"
        width="8"
        height="16"
        rx="1"
        fill="#38bdf8">

        <animate
            attributeName="opacity"
            values="1;0;1"
            dur="1s"
            repeatCount="indefinite"/>

    </rect>

</svg>