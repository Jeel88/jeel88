name: Update GitHub Stats

on:
  schedule:
    # Runs every day at 00:05 IST
    # 00:05 IST = 18:35 UTC
    - cron: "35 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Streak
        run: |
          mkdir -p assets/stats

          curl -L \
            "https://streak-stats.demolab.com/?user=Jeel88&theme=blood&hide_border=true" \
            -o assets/stats/streak.svg

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stats/streak.svg

          git diff --cached --quiet || \
          git commit -m "chore: update GitHub stats"

          git push
