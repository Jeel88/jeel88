<svg
    xmlns="http://www.w3.org/2000/svg"
    width="960"
    height="580"
    viewBox="0 0 960 580">

    <defs>

        <!-- ================================================= -->
        <!-- GLASS -->
        <!-- ================================================= -->

        <linearGradient
            id="glass"
            x1="0"
            y1="0"
            x2="1"
            y2="1">

            <stop
                offset="0%"
                stop-color="#111827"/>

            <stop
                offset="100%"
                stop-color="#020617"/>

        </linearGradient>


        <!-- ================================================= -->
        <!-- GLOW -->
        <!-- ================================================= -->

        <radialGradient id="glow">

            <stop
                offset="0%"
                stop-color="#38bdf8"
                stop-opacity="0.12"/>

            <stop
                offset="100%"
                stop-color="#38bdf8"
                stop-opacity="0"/>

        </radialGradient>


        <!-- ================================================= -->
        <!-- SHADOW -->
        <!-- ================================================= -->

        <filter id="shadow">

            <feDropShadow
                dx="0"
                dy="15"
                stdDeviation="20"
                flood-opacity="0.35"/>

        </filter>

    </defs>


    <!-- ================================================= -->
    <!-- TERMINAL WINDOW -->
    <!-- ================================================= -->

    <rect
        x="20"
        y="20"
        width="920"
        height="540"
        rx="24"
        fill="url(#glass)"
        stroke="#334155"
        stroke-width="1"
        filter="url(#shadow)"/>


    <!-- ================================================= -->
    <!-- BACKGROUND GLOW -->
    <!-- ================================================= -->

    <ellipse
        cx="480"
        cy="300"
        rx="420"
        ry="250"
        fill="url(#glow)"/>


    <!-- ================================================= -->
    <!-- macOS BUTTONS -->
    <!-- ================================================= -->

    <circle
        cx="55"
        cy="55"
        r="8"
        fill="#ff5f57"/>

    <circle
        cx="80"
        cy="55"
        r="8"
        fill="#febc2e"/>

    <circle
        cx="105"
        cy="55"
        r="8"
        fill="#28c840"/>


    <!-- ================================================= -->
    <!-- TITLE -->
    <!-- ================================================= -->

    <text
        x="480"
        y="61"
        text-anchor="middle"
        fill="#94a3b8"
        font-size="16"
        font-family="monospace">

        jeel@github — skills

    </text>


    <!-- ================================================= -->
    <!-- TOP DIVIDER -->
    <!-- ================================================= -->

    <line
        x1="20"
        y1="90"
        x2="940"
        y2="90"
        stroke="#334155"
        stroke-width="1"/>


    <!-- ================================================= -->
    <!-- COMMAND -->
    <!-- ================================================= -->

    <text
        x="50"
        y="130"
        fill="#e2e8f0"
        font-size="18"
        font-family="monospace">

        jeel@github %

    </text>

    <text
        x="215"
        y="130"
        fill="#38bdf8"
        font-size="18"
        font-family="monospace">

        cat skills.txt

    </text>


    <!-- ================================================= -->
    <!-- LANGUAGES -->
    <!-- ================================================= -->

    <text
        x="70"
        y="175"
        fill="#38bdf8"
        font-size="15"
        font-family="monospace">

        LANGUAGES

    </text>


    <!-- C -->
    <image
        href="https://raw.githubusercontent.com/devicons/devicon/master/icons/c/c-original.svg"
        x="70"
        y="190"
        width="42"
        height="42"/>

    <text
        x="120"
        y="217"
        fill="#e2e8f0"
        font-size="14"
        font-family="monospace">

        C

    </text>


    <!-- C++ -->
    <image
        href="https://raw.githubusercontent.com/devicons/devicon/master/icons/cplusplus/cplusplus-original.svg"
        x="190"
        y="190"
        width="42"
        height="42"/>

    <text
        x="240"
        y="217"
        fill="#e2e8f0"
        font-size="14"
        font-family="monospace">

        C++

    </text>


    <!-- JAVA -->
    <image
        href="https://raw.githubusercontent.com/devicons/devicon/master/icons/java/java-original.svg"
        x="320"
        y="190"
        width="42"
        height="42"/>

    <text
        x="370"
        y="217"
        fill="#e2e8f0"
        font-size="14"
        font-family="monospace">

        Java

    </text>


    <!-- PYTHON -->
