<style>

.ascii {
    font-family:
        "SFMono-Regular",
        "Cascadia Mono",
        "JetBrains Mono",
        Consolas,
        monospace;

    font-size: 8px;
    fill: #E5E7EB;

    opacity: 0;

    animation:
        reveal
        0.5s
        ease-out
        forwards;
}

@keyframes reveal {

    from {
        opacity: 0;
        transform: translateX(-6px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}

</style>

